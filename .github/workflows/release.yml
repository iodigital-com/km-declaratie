name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Haal versienummer op uit tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Update version.json
        run: |
          cat > public/version.json << EOF
          {
            "version": "${{ steps.version.outputs.VERSION }}",
            "downloadUrl": "https://github.com/momeeuw/km-declaratie/releases/latest/download/km-declaratie.html",
            "changelog": "Zie de release notes op GitHub voor wijzigingen"
          }
          EOF

      - name: Commit version.json naar main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/version.json
          git commit -m "chore: bump version.json naar ${{ steps.version.outputs.VERSION }}"
          git push origin main

      - name: Build standalone HTML
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Hernoem build output
        run: mv dist/index.html dist/km-declaratie.html

      - name: Maak GitHub Release aan
        uses: softprops/action-gh-release@v2
        with:
          files: dist/km-declaratie.html
          generate_release_notes: true
