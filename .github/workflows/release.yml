name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Haal versienummer op uit tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Update versienummer in version.json (behoud changelog)
        run: |
          node -e "
            const fs = require('fs');
            const f = 'public/version.json';
            const j = JSON.parse(fs.readFileSync(f, 'utf8'));
            j.version = '${{ steps.version.outputs.VERSION }}';
            j.downloadUrl = 'https://github.com/iodigital-com/km-declaratie/releases/latest/download/km-declaratie.html';
            fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
          "

      - name: Commit bijgewerkte version.json naar main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/version.json
          git commit -m "chore: versienummer bijwerken naar ${{ steps.version.outputs.VERSION }}" || echo "Niets te committen"
          git push origin HEAD:main

      - name: Build standalone HTML
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Hernoem build output
        run: mv dist/index.html dist/km-declaratie.html

      - name: Maak GitHub Release aan
        uses: softprops/action-gh-release@v2
        with:
          files: dist/km-declaratie.html
          generate_release_notes: true
